<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Birthday Surprise 💖</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
html,body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:'Segoe Script', cursive;
  background:linear-gradient(120deg,#ffd1e8,#d6e4ff,#e6d7ff);
  background-size:400% 400%;
  animation:bg 12s ease infinite;
}

@keyframes bg{
  0%{background-position:0% 50%}
  50%{background-position:100% 50%}
  100%{background-position:0% 50%}
}

#center{
  position:absolute;
  top:40%;
  width:100%;
  text-align:center;
  transform:translateY(-50%);
}

#title{
  font-size:3em;
  color:#ff2f92;
  text-shadow:0 0 10px #ff7acb,0 0 25px #ffc1e3;
  min-height:1.5em;
}

#tap{
  margin-top:15px;
  font-size:1.1em;
  color:#444;
}

#note{
  display:none;
  max-width:900px;
  margin:60px auto;
  padding:20px;
  text-align:center;
  font-size:1.8em;
  line-height:1.6;
  color:#2b004f;
  text-shadow:0 0 10px #ff7acb,0 0 20px #ffb3de;
  animation:fade 2s ease forwards;
}

@keyframes fade{
  from{opacity:0; transform:translateY(20px);}
  to{opacity:1; transform:translateY(0);}
}

.heart{
  position:fixed;
  font-size:22px;
  animation:float 3s linear forwards;
  pointer-events:none;
}

@keyframes float{
  from{transform:translateY(0) scale(1);opacity:1;}
  to{transform:translateY(-150px) scale(1.8);opacity:0;}
}

#playing{
  position:fixed;
  bottom:20px;
  right:20px;
  background:#ff5fa2;
  color:white;
  padding:10px 16px;
  border-radius:30px;
  font-size:14px;
  display:none;
  box-shadow:0 0 15px #ff8fc2;
}
</style>
</head>

<body>

<div id="center">
  <div id="title"></div>
  <div id="tap">Touch anywhere on the screen 💖</div>
</div>

<div id="note">
WELCOME TO A DAY FILLED WITH LOVE, SMILES, AND BEAUTIFUL MEMORIES.  
THE BEST DAY OF THE YEAR IS HERE — YOUR BIRTHDAY 😘  
HAPPIEST BIRTHDAY TO MY LOVE MY EVERYTHING 💜.....
</div>

<div id="playing">🎵 Playing...</div>

<audio id="song" preload="auto">
  <source src="o-maahi.mp3.mp3" type="audio/mpeg">
</audio>

<script>
const text="Happy Birthday My Love ❤️🎂✨";
let i=0;
const title=document.getElementById("title");

function type(){
  if(i<text.length){
    title.innerHTML+=text.charAt(i);
    i++;
    setTimeout(type,100);
  }
}
type();

const colors=["❤️","💙","💜","💚","💛","🩵","🩷","🤍"];
let started=false;
const audio=document.getElementById("song");

document.body.addEventListener("click",()=>{
  pop(event.clientX,event.clientY);

  if(!started){
    started=true;
    document.getElementById("note").style.display="block";
    document.getElementById("playing").style.display="block";

    audio.currentTime=80;
    audio.play().catch(()=>alert("Tap again to allow music 🎵"));
  }
});

function pop(x,y){
  const h=document.createElement("div");
  h.className="heart";
  h.innerHTML=colors[Math.floor(Math.random()*colors.length)];
  h.style.left=x+"px";
  h.style.top=y+"px";
  document.body.appendChild(h);
  setTimeout(()=>h.remove(),3000);
}
</script>

</body>
</html>
