<!DOCTYPE html>
<html>
<head>
  <title>Secret ❤️</title>
  <style>
    body {
      background: pink;
      font-family: Arial;
      text-align: center;
      padding-top: 100px;
    }
    input, button {
      padding: 10px;
      font-size: 16px;
    }
  </style>
</head>
<body>

  <h2>Enter the secret password 💖</h2>
  <input type="password" id="pass" placeholder="Hint: only you know 😉">
  <br><br>
  <button onclick="check()">Enter</button>

  <script>
    function check() {
      if (document.getElementById("pass").value === "0710") {
        window.location.href = "surprise.html";
      } else {
        alert("Wrong password 💔");
      }
    }
  </script>

</body>
</html>
